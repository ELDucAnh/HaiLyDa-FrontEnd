<!DOCTYPE html>
<html lang="vi" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quên Mật Khẩu — MiltyWay</title>
  <meta name="description" content="Khôi phục mật khẩu tài khoản hệ thống quản lý chuỗi trà sữa MiltyWay.">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/tailwind.css">
  <script>try{if(localStorage.getItem('sf_theme')==="dark"){document.documentElement.classList.add("dark")}else{document.documentElement.classList.remove("dark")}}catch(e){}</script>
</head>
<body class="auth-body">
  <div class="w-full max-w-[420px] p-4">
    <div class="text-center mb-6">
      <a href="login.html" class="auth-back-link text-xs text-[var(--muted)] hover:text-[var(--primary)] flex items-center justify-center gap-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Quay lại màn hình Đăng Nhập
      </a>
    </div>
    <div class="auth-card text-center shadow-xl">
      <div class="stat-icon icon-bg-primary w-16 h-16 rounded-[20px] mx-auto mb-4 flex items-center justify-center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h1 class="auth-title text-xl font-bold">Quên Mật Khẩu?</h1>
      <p class="auth-subtitle leading-relaxed mb-6 text-xs text-[var(--muted)]">Nhập địa chỉ email nội bộ của bạn để nhận mã xác thực đặt lại mật khẩu hệ thống.</p>
      
      <form id="forgot-form" class="flex flex-col gap-4 text-left">
        <div>
          <label class="form-label" for="forgot-email">Email Nội Bộ / Cá Nhân <span class="text-red-500">*</span></label>
          <input id="forgot-email" type="email" class="form-input" placeholder="ten.nv@miltyway.vn" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-full justify-center">
          Gửi Hướng Dẫn Khôi Phục
        </button>
      </form>
    </div>
  </div>
  <div id="toast-container" class="fixed bottom-5 right-5 z-[200] flex flex-col gap-2.5"></div>
  <script src="../assets/js/app.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', function(e) {
      e.preventDefault();
      Toast.success('Đã gửi mã xác thực khôi phục mật khẩu vào hòm thư nội bộ!', 'Đã Gửi Thư');
      setTimeout(() => window.location.href = 'reset-password.html', 1200);
    });
  </script>
</body>
</html>
